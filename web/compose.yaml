name: travel-planner

services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/travel_planner.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - travel_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${TRAVEL_PLANNER_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  travel_data:
    name: travel-planner-data
